# Publishes a release when a version tag is pushed (`make ci-release`): ftor-calls.app signed
# with Developer ID and notarized, uploaded to apps.ftor.dev, where installed apps update
# from and ftor lists it. Infra and secrets live in ftor (ops/terraform/apps.tf, ADR 0010);
# this workflow logs in to Infisical over OIDC and holds no secret of its own.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # the OIDC token Infisical checks

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0 # the previous tag, for the release notes

      # Each call exports one folder as environment variables for the steps below.
      - name: Secrets (/apple)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /apple
      - name: Secrets (/r2)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /r2
      - name: Secrets (/calls)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /calls

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Sidecars
        run: ./scripts/build-sidecars.sh
      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      # Signs (APPLE_CERTIFICATE…), notarizes (APPLE_ID…) and signs the update
      # (TAURI_SIGNING_PRIVATE_KEY…), all from the environment Infisical set.
      - name: Build
        run: pnpm tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json
        working-directory: apps/desktop

      - name: Publish
        run: ./scripts/publish.sh
