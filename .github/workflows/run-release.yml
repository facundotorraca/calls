# One-click release: Actions > run-release > Run workflow. Bumps the version, builds
# ftor-calls.app, signs it with Developer ID, notarizes it and publishes it to apps.ftor.dev,
# where installed apps update from and ftor lists it; then commits the version and tags it.
# Nothing is committed if any step fails. Infra and secrets live in ftor (ops/terraform/apps.tf,
# ADR 0010): this logs in to Infisical over OIDC and holds no secret of its own.
name: run-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time: two would compute the same version.
concurrency:
  group: run-release
  cancel-in-progress: false

permissions:
  contents: write # the version commit and its tag
  id-token: write # the OIDC token Infisical checks

jobs:
  release:
    # Infisical only accepts this workflow, on main (ops/terraform/apps.tf).
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0 # the previous tag, for the release notes

      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          conf=apps/desktop/src-tauri/tauri.conf.json
          current="$(plutil -extract version raw "$conf")"
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i '' "s/^  \"version\": \"$current\"/  \"version\": \"$version\"/" "$conf"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "### $current → $version" >>"$GITHUB_STEP_SUMMARY"

      # Each call exports one folder as environment variables for the steps below.
      - name: Secrets (/apple)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /apple
      - name: Secrets (/r2)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /r2
      - name: Secrets (/calls)
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: ftor-apps
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /calls

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Sidecars
        run: ./scripts/build-sidecars.sh
      - name: Frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      # Signs (APPLE_CERTIFICATE…), notarizes (APPLE_ID…) and signs the update
      # (TAURI_SIGNING_PRIVATE_KEY…), all from the environment Infisical set.
      - name: Build
        run: pnpm tauri build --bundles app,dmg --config src-tauri/tauri.release.conf.json
        working-directory: apps/desktop

      - name: Publish
        run: ./scripts/publish.sh

      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release v$VERSION" -- apps/desktop/src-tauri/tauri.conf.json
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
