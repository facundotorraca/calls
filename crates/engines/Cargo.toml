[package]
name = "calls-engines"
description = "Adapters that implement the core traits by running external tools (ffmpeg, whisper.cpp)."
version.workspace = true
edition.workspace = true

[dependencies]
calls-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# macOS's own TLS (Security.framework) for downloading models from Hugging Face.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
